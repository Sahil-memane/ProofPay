services:
  - type: web
    name: proofpay-api
    runtime: python
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proofpay-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: SIMULATOR_ENABLED
        value: "true"
      - key: INTERNAL_TICK_TOKEN
        generateValue: true
      - key: POLICY_SIGNING_KEY
        generateValue: true
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_EXEC_MODE
        value: rest
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: EMAIL_MODE
        value: outbox

databases:
  - name: proofpay-db
    plan: free
    postgresMajorVersion: 16
